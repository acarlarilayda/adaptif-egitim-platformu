<div
  class="virtual-scroll-list"
  [style.height.px]="viewportHeight"
  (scroll)="onScroll($event)"
>
  <div class="virtual-scroll-list__spacer" [style.height.px]="totalHeight()">
    <div class="virtual-scroll-list__content" [style.transform]="'translateY(' + offsetY() + 'px)'">
      @for (row of visibleItems(); track row.index) {
        <div class="virtual-scroll-list__row" [style.height.px]="itemHeight">
          <ng-container
            *ngTemplateOutlet="rowTemplate; context: { $implicit: row.item, index: row.index }"
          ></ng-container>
        </div>
      }
    </div>
  </div>
</div>
