<span
  class="autosave-indicator"
  [class]="'autosave-indicator--' + status"
  role="status"
  aria-live="polite"
>
  @if (status === 'synced') {
    Kaydedildi
  } @else if (status === 'conflict') {
    Çakışma: bu cevap başka bir yerden güncellendi, sayfayı yenileyin
  } @else if (status === 'pending') {
    Kaydediliyor...
  } @else {
    Kayıt hatası
  }
</span>
