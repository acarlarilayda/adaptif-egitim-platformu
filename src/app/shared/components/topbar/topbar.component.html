<header class="topbar">
  <div class="topbar__brand">
    Adaptif Eğitim Platformu
  </div>

 <nav class="topbar__nav">
    <a routerLink="/learning-path" routerLinkActive="active">Öğrenme Yolum</a>
    <a routerLink="/exam-session" routerLinkActive="active">Sınav Oturumu</a>
    <a routerLink="/recommendations" routerLinkActive="active">Öneriler</a>
    <a routerLink="/outcomes" routerLinkActive="active">Kazanım Haritası</a>
    <a routerLink="/question-bank" routerLinkActive="active">Soru Bankası</a>
    <a routerLink="/exam-builder" routerLinkActive="active">Sınav Oluşturucu</a>
    <a routerLink="/grading" routerLinkActive="active">Değerlendirme</a>
    <a routerLink="/item-analysis" routerLinkActive="active">Soru Analizi</a>
    <a routerLink="/audit-log" routerLinkActive="active">Denetim Kayıtları</a>
    <a routerLink="/student/u-student-1/analytics" routerLinkActive="active">Öğrenci Analitiği</a>
    <a routerLink="/cohort-analytics" routerLinkActive="active">Kohort Analitiği</a>
  </nav>

  <div class="topbar__user">
    <span class="topbar__label">Aktif Kullanıcı:</span>

    <select
      class="topbar__select"
      [ngModel]="auth.currentUser().id"
      (ngModelChange)="onUserChange($event)"
    >
      @for (user of auth.demoUsers; track user.id) {
        <option [value]="user.id">
          {{ user.name }} — {{ roleLabels[user.role] }}
        </option>
      }
    </select>
  </div>
</header>
