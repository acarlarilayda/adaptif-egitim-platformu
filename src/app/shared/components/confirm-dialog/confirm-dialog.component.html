@if (isOpen) {
  <div class="dialog-overlay" (click)="onCancel()">
    <div class="dialog-box" (click)="$event.stopPropagation()">
      <h3 class="dialog-box__title">{{ title }}</h3>
      <p class="dialog-box__message">{{ message }}</p>

      <div class="dialog-box__actions">
        <button class="dialog-box__cancel" (click)="onCancel()">
          {{ cancelLabel }}
        </button>
        <button class="dialog-box__confirm" (click)="onConfirm()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
