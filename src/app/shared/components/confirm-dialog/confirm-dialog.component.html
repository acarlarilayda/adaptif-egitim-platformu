@if (isOpen) {
  <div class="dialog-overlay" (click)="onCancel()">
    <div
      class="dialog-box"
      #dialogBox
      role="alertdialog"
      aria-modal="true"
      [attr.aria-labelledby]="titleId"
      [attr.aria-describedby]="messageId"
      (click)="$event.stopPropagation()"
    >
      <h3 class="dialog-box__title" [id]="titleId">{{ title }}</h3>
      <p class="dialog-box__message" [id]="messageId">{{ message }}</p>

      <div class="dialog-box__actions">
        <button #cancelButton type="button" class="dialog-box__cancel" (click)="onCancel()">
          {{ cancelLabel }}
        </button>
        <button type="button" class="dialog-box__confirm" (click)="onConfirm()">
          {{ confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
